name: Generate dependency lockfile
on:
  push:
    branches: [feat/premium-react-ui]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
      - name: Resolve Base UI lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          echo LOCKFILE_BEGIN
          base64 -w 100 package-lock.json
          echo LOCKFILE_END
