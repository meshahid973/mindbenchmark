<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="MindBenchmark. Test your reflexes and memory." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>MindBenchmark | Test your mind</title>
    <script>
      try {
        if (localStorage.getItem("mindbenchmark-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f7f7f7");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
